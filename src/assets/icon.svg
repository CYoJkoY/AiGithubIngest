<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" role="img" aria-label="AiGithubIngest Action Icon">
  <defs>
    <style>
      .m-surface { fill: #FAF9F5; stroke: rgba(40, 36, 32, 0.20); stroke-width: 1px; }
      .m-doc { fill: #F5F3EC; stroke: #1C1A17; stroke-width: 1.2px; stroke-linejoin: round; }
      .m-crease { stroke: rgba(40, 36, 32, 0.30); stroke-width: 0.8px; fill: none; }
      .m-stem { stroke: #1C1A17; stroke-width: 1.2px; stroke-linecap: round; fill: none; }
      .m-dot { fill: #1C1A17; }
      .m-seal { fill: #A6382A; }

      @media (prefers-color-scheme: dark) {
        .m-surface { fill: #1B1C20; stroke: rgba(240, 235, 225, 0.16); }
        .m-doc { fill: #131416; stroke: #EDEAE2; }
        .m-crease { stroke: rgba(240, 235, 225, 0.25); }
        .m-stem { stroke: #EDEAE2; }
        .m-dot { fill: #EDEAE2; }
        .m-seal { fill: #C84A3B; }
      }
    </style>
  </defs>

  <!-- 和纸底卡 -->
  <rect class="m-surface" x="1.5" y="1.5" width="29" height="29" rx="1.5" />

  <!-- 卷页轮廓 (带右上折痕) -->
  <path class="m-doc" d="M 7 6 H 18 L 24 12 V 26 H 7 Z" />
  <path class="m-crease" d="M 18 6 V 12 H 24" />

  <!-- 简约代码分支树 -->
  <path class="m-stem" d="M 11 22 V 12 M 11 17 C 11 14, 15 14, 15 13" />
  <circle class="m-dot" cx="11" cy="22" r="1.3" />
  <circle class="m-dot" cx="11" cy="12" r="1.3" />
  <circle class="m-dot" cx="15" cy="13" r="1.1" />

  <!-- 右下朱砂小方印 -->
  <rect class="m-seal" x="17.5" y="19.5" width="4.5" height="4.5" rx="0.5" />
</svg>
