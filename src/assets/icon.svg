<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- 背景渐变：AzSkills 黑曜石高质感底色 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- 容器微光边框 -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Git 拓扑与数据流渐变 -->
    <linearGradient id="git-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- AI 核心单体渐变 -->
    <linearGradient id="ai-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- 1. 外层容器与极简圆角倒角 -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />

  <!-- 2. Git 拓扑干线 (左侧) -->
  <!-- 主分支干线 -->
  <path d="M 28 38 L 28 90" stroke="url(#git-flow)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Ingest 分支弧线：平滑切出并在 x=46 处结束，不接触后续元素 -->
  <path d="M 28 68 C 28 64 36 64 46 64" stroke="url(#git-flow)" stroke-width="4" stroke-linecap="round" />

  <!-- 主分支 Top Commit 节点 -->
  <circle cx="28" cy="38" r="6" fill="#090D16" stroke="#38BDF8" stroke-width="3" />
  <circle cx="28" cy="38" r="2" fill="#38BDF8" />

  <!-- 主分支 Bottom Commit 节点 -->
  <circle cx="28" cy="90" r="6" fill="#090D16" stroke="#38BDF8" stroke-width="3" />
  <circle cx="28" cy="90" r="2" fill="#38BDF8" />

  <!-- 分支 Commit 节点 (Ingest 出发点，完全独立) -->
  <circle cx="48" cy="64" r="6" fill="#090D16" stroke="#60A5FA" stroke-width="3" />
  <circle cx="48" cy="64" r="2" fill="#60A5FA" />

  <!-- 3. 数据流注入管道 (中央独立脉冲指示器，保持 5px 留白间距) -->
  <path d="M 60 58 L 65 64 L 60 70" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 68 58 L 73 64 L 68 70" stroke="#818CF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 4. AI 上下文星芒 (右侧，中心坐标 (94, 64)，左顶点止于 x=78，与流向箭头完全断开) -->
  <path d="M 94 42 
           C 94 54 88 64 78 64 
           C 88 64 94 74 94 86 
           C 94 74 100 64 110 64 
           C 100 64 94 54 94 42 Z" 
        fill="url(#ai-star)" />
</svg>
