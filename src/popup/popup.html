<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <!-- 顶栏：品牌标识与左右滑块控制区域 -->
      <header class="app-topbar">
        <div class="brand-group">
          <img src="assets/icon.svg" class="app-logo" alt="Logo" width="22" height="22" />
          <span class="app-name">AiGithubIngest</span>
        </div>
        <div class="topbar-actions">
          <!-- 界面语言左右滑块切换 (中 <-> EN) -->
          <div class="switch-control" title="切换界面语言 / Toggle Language">
            <input
              type="checkbox"
              id="lang-toggle"
              class="switch-checkbox"
              aria-label="Language Switch"
            />
            <label for="lang-toggle" class="switch-slider">
              <span class="switch-label left">中</span>
              <span class="switch-label right">EN</span>
              <span class="switch-thumb"></span>
            </label>
          </div>

          <!-- 日间/夜间模式左右滑块切换 (☀️ <-> 🌙) -->
          <div class="switch-control" title="切换浅色/深色模式 / Toggle Light & Dark Mode">
            <input
              type="checkbox"
              id="theme-toggle"
              class="switch-checkbox"
              aria-label="Theme Switch"
            />
            <label for="theme-toggle" class="switch-slider">
              <span class="switch-icon left" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                  <path
                    d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"
                  />
                </svg>
              </span>
              <span class="switch-icon right" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                  <path
                    d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"
                  />
                </svg>
              </span>
              <span class="switch-thumb"></span>
            </label>
          </div>

          <a
            id="github-link"
            class="topbar-icon-link"
            href="https://github.com/CYoJkoY/AiGithubIngest"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub Repository"
          >
            <img src="assets/icon-github.svg" alt="" width="15" height="15" />
          </a>
        </div>
      </header>

      <!-- 核心站点状态与策略卡片 -->
      <section class="card card-policy">
        <div class="card-header">
          <span class="section-title" id="lbl-title">当前站点策略</span>
          <span id="site-badge" class="badge badge--neutral">
            <span class="badge-dot"></span>
            <span class="badge-text">Checking...</span>
          </span>
        </div>
        <div class="site-display-box">
          <span class="site-icon">🌐</span>
          <span class="current-site-domain" id="current-domain">--</span>
        </div>
        <div class="action-btn-group">
          <button id="toggle-btn" class="btn btn-primary btn-action" disabled>...</button>
          <button id="blacklist-current-btn" class="btn btn-danger btn-action hidden">
            加入黑名单
          </button>
        </div>
      </section>

      <!-- 黑名单快捷控制卡片 -->
      <section class="card">
        <div class="card-header">
          <span class="section-title" id="lbl-blacklist-title">黑名单管理</span>
        </div>
        <div class="input-action-row">
          <input
            id="blacklist-input"
            type="text"
            class="input-text"
            placeholder="输入域名，如 doubao.com"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="add-blacklist-btn" class="btn btn-secondary btn-compact">拉黑</button>
        </div>
        <div id="blacklist-tags" class="blacklist-tags"></div>
      </section>

      <!-- GitHub 凭据配置卡片 -->
      <section class="card">
        <div class="card-header">
          <span class="section-title" id="lbl-token-title">GitHub PAT 凭据</span>
        </div>
        <div class="input-action-row token-row">
          <input
            id="token-input"
            type="password"
            class="input-text token-input"
            placeholder="ghp_xxx (repo scope)"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            id="toggle-token-visibility"
            class="btn-icon"
            title="Toggle Visibility"
            aria-label="Toggle Visibility"
          >
            👁
          </button>
        </div>
        <p class="hint-text" id="lbl-token-hint">
          配置 Personal Access Token 可解析私有仓库并提升 API 速率至 5,000次/h。
        </p>
        <div class="btn-grid-dual">
          <button id="save-token-btn" class="btn btn-primary">保存</button>
          <button id="clear-token-btn" class="btn btn-secondary">清除</button>
        </div>
        <div id="token-status" class="token-status" aria-live="polite"></div>
      </section>

      <!-- 站点文件大小阈值设置 -->
      <section class="card">
        <div class="card-header">
          <span class="section-title" id="lbl-site-limits-title">分片阈值配置 (MB)</span>
        </div>
        <p class="hint-text" id="lbl-site-limits-hint">
          为 AI 站点单独配置上限，超限时将拆分为多份附件文件并自动顺序挂载。
        </p>
        <div id="site-limits-list" class="site-limits-list"></div>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
