<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <!-- 顶栏：品牌标识与左右滑块控制区域 -->
      <header class="app-topbar">
        <div class="brand-group">
          <img src="assets/icon.svg" class="app-logo" alt="Logo" width="22" height="22" />
          <span class="app-name">AiGithubIngest</span>
        </div>
        <div class="topbar-actions">
          <!-- 界面语言左右滑块切换 (中 <-> EN) -->
          <div class="switch-control" id="lang-switch-wrapper">
            <!-- 移除硬编码 title，由 JS 注入 -->
            <input
              type="checkbox"
              id="lang-toggle"
              class="switch-checkbox"
              aria-label="Language Switch"
            />
            <label for="lang-toggle" class="switch-slider">
              <span class="switch-label left">中</span>
              <span class="switch-label right">EN</span>
              <span class="switch-thumb"></span>
            </label>
          </div>

          <!-- 日间/夜间模式左右滑块切换 (☀️ <-> 🌙) -->
          <div class="switch-control" id="theme-switch-wrapper">
            <input
              type="checkbox"
              id="theme-toggle"
              class="switch-checkbox"
              aria-label="Theme Switch"
            />
            <label for="theme-toggle" class="switch-slider">
              <span class="switch-icon left" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <circle cx="12" cy="12" r="3.2" />
                  <path d="M12 3.5v2.2" />
                  <path d="M12 18.3v2.2" />
                  <path d="M3.5 12h2.2" />
                  <path d="M18.3 12h2.2" />
                  <path d="M6.3 6.3l1.6 1.6" />
                  <path d="M16.1 16.1l1.6 1.6" />
                  <path d="M17.7 6.3l-1.6 1.6" />
                  <path d="M7.9 16.1l-1.6 1.6" />
                </svg>
              </span>
              <span class="switch-icon right" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M20.2 14.2A8.2 8.2 0 0 1 9.8 3.8a8.2 8.2 0 1 0 10.4 10.4Z" />
                </svg>
              </span>
              <span class="switch-thumb"></span>
            </label>
          </div>

          <a
            id="github-link"
            class="topbar-icon-link"
            href="https://github.com/CYoJkoY/AiGithubIngest"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub Repository"
          >
            <img src="assets/icon-github.svg" alt="" width="15" height="15" />
          </a>
        </div>
      </header>

      <!-- 核心站点状态与策略卡片 -->
      <section class="card card-policy">
        <div class="card-header">
          <span class="section-title" id="lbl-title">当前站点策略</span>
          <span id="site-badge" class="badge badge--neutral">
            <span class="badge-dot"></span>
            <span class="badge-text">Checking...</span>
          </span>
        </div>
        <div class="site-display-box">
          <span class="site-icon">🌐</span>
          <span class="current-site-domain" id="current-domain">--</span>
        </div>
        <div class="action-btn-group">
          <button id="toggle-btn" class="btn btn-primary btn-action" disabled>...</button>
          <button id="blacklist-current-btn" class="btn btn-danger btn-action hidden"></button>
        </div>
      </section>

      <!-- 黑名单快捷控制卡片 -->
      <section class="card">
        <div class="card-header">
          <span class="section-title" id="lbl-blacklist-title">黑名单管理</span>
        </div>
        <div class="input-action-row">
          <input
            id="blacklist-input"
            type="text"
            class="input-text"
            placeholder="输入域名，如 doubao.com"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="add-blacklist-btn" class="btn btn-secondary btn-compact">拉黑</button>
        </div>
        <div id="blacklist-tags" class="blacklist-tags"></div>
      </section>

      <!-- GitHub 凭据配置卡片 -->
      <section class="card">
        <div class="card-header">
          <span class="section-title" id="lbl-token-title">GitHub PAT 凭据</span>
        </div>
        <div class="input-action-row token-row">
          <input
            id="token-input"
            type="password"
            class="input-text token-input"
            placeholder="ghp_xxx (repo scope)"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            id="toggle-token-visibility"
            class="btn-icon"
            title="Toggle Visibility"
            aria-label="Toggle Visibility"
          >
            👁
          </button>
        </div>
        <p class="hint-text" id="lbl-token-hint"></p>
        <div class="btn-grid-dual">
          <button id="save-token-btn" class="btn btn-primary">保存</button>
          <button id="clear-token-btn" class="btn btn-secondary">清除</button>
        </div>
        <div id="token-status" class="token-status" aria-live="polite"></div>
      </section>

      <!-- 站点文件大小阈值设置 -->
      <section class="card">
        <div class="card-header">
          <span class="section-title" id="lbl-site-limits-title">分片阈值配置 (MB)</span>
        </div>
        <p class="hint-text" id="lbl-site-limits-hint"></p>
        <div id="site-limits-list" class="site-limits-list"></div>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
