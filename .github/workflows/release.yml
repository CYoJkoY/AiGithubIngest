name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*.dev*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v0.6.0 or v0.6.0.dev01)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict Typecheck
        run: pnpm exec tsc --noEmit

      # -----------------------------------------------------------------------
      # Tag 是发布的唯一真相源：
      #   - vX.Y.Z          → 正式通道，产物移除 version_name
      #   - vX.Y.Z.devN     → 开发通道，产物 version_name = X.Y.Z.devN
      # manifest.json 仅需维护基线 version = X.Y.Z；
      # 打 tag 前无需修改 manifest.json，无需切换 version_name。
      # -----------------------------------------------------------------------
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version || ''")
          PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version || ''")

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "🔍 版本契约复核（Tag 为唯一真相源）："
          echo "  - Git Tag:           ${TAG}"
          echo "  - manifest.version:  ${MANIFEST_VERSION}"
          echo "  - package.json:      ${PKG_VERSION}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$ ]]; then
            echo "::error::无效的 Release Tag 格式: $TAG （应为 vX.Y.Z 或 vX.Y.Z.devN）"
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          IS_DEV="false"

          if [[ "$TAG_VERSION" == *.dev[0-9]* ]]; then
            IS_DEV="true"
            TAG_BASE="${TAG_VERSION%%.dev*}"
            if [[ "$TAG_BASE" != "$MANIFEST_VERSION" ]]; then
              echo "::error::开发版 Tag 基础版本 ($TAG_BASE) 必须等于 manifest.version ($MANIFEST_VERSION)"
              exit 1
            fi
          else
            if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]]; then
              echo "::error::正式版 Tag ($TAG_VERSION) 必须等于 manifest.version ($MANIFEST_VERSION)"
              exit 1
            fi
          fi

          if [[ "$PKG_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "::error::package.json 版本 ($PKG_VERSION) 必须等于 manifest.version ($MANIFEST_VERSION)"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_dev=$IS_DEV" >> "$GITHUB_OUTPUT"
          echo "✅ 版本复核通过：RELEASE_VERSION=${TAG_VERSION}, IS_DEV=${IS_DEV}"

      - name: Build production bundle
        run: pnpm run build

      - name: Normalize dist/manifest.json by release channel
        shell: bash
        env:
          IS_DEV: ${{ steps.version.outputs.is_dev }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const manifestPath = 'dist/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const isDev = process.env.IS_DEV === 'true';
          const tagVersion = process.env.RELEASE_VERSION;

          // Chrome 强制要求 manifest.version 为纯数字 X.Y.Z，
          // dev 语义必须借助 version_name 承载。
          if (isDev) {
            manifest.version_name = tagVersion;
            console.log(
              `[Normalize] Dev channel → version=${manifest.version}, version_name=${manifest.version_name}`
            );
          } else {
            delete manifest.version_name;
            console.log(`[Normalize] Stable channel → version=${manifest.version}, version_name=<removed>`);
          }

          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n', 'utf8');
          NODE

      - name: Validate distribution integrity
        run: |
          echo "🔍 正在进行 Manifest V3 产物完整性防御审查..."
          REQUIRED_FILES=(
            "dist/manifest.json"
            "dist/background.js"
            "dist/content.js"
            "dist/popup.html"
            "dist/popup.js"
            "dist/popup.css"
            "dist/toast.css"
          )

          for assetPath in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$assetPath" ]; then
              echo "❌ 关键产物缺失: $assetPath"
              exit 1
            fi
          done

          BUILT_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).version || ''")
          BUILT_VERSION_NAME=$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).version_name || ''")
          echo "  - 构建产物 version:        ${BUILT_VERSION}"
          echo "  - 构建产物 version_name:   ${BUILT_VERSION_NAME:-<empty>}"
          echo "✅ 产物契约校验通过"

      - name: Package extension archive (ZIP & CRX)
        id: package
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          ARCHIVE_NAME="ai-github-ingest-v${VERSION}.zip"
          CRX_NAME="ai-github-ingest-v${VERSION}.crx"

          echo "📦 打包 ZIP 产物: ${ARCHIVE_NAME}"
          cd dist
          zip -r "../${ARCHIVE_NAME}" ./* -x "*.DS_Store*"
          cd ..
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

          if [ -n "${CRX_PRIVATE_KEY:-}" ]; then
            echo "🔑 使用 CRX_PRIVATE_KEY 签名打包 CRX3..."
            trap 'rm -f key.pem' EXIT
            echo "$CRX_PRIVATE_KEY" > key.pem
            npx --yes crx3 pack dist -p key.pem -o "${CRX_NAME}"
            rm -f key.pem
            sha256sum "${CRX_NAME}" > "${CRX_NAME}.sha256"
          else
            echo "::warning::未检测到 CRX_PRIVATE_KEY Secret，已跳过 CRX 打包，仅发布 ZIP 产物"
          fi

          echo "archive=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "crx=${CRX_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 'Release ${{ steps.version.outputs.tag }}'
          files: |
            ai-github-ingest-v${{ steps.version.outputs.version }}.zip
            ai-github-ingest-v${{ steps.version.outputs.version }}.zip.sha256
            ai-github-ingest-v${{ steps.version.outputs.version }}*.crx
            ai-github-ingest-v${{ steps.version.outputs.version }}*.crx.sha256
          draft: false
          prerelease: ${{ steps.version.outputs.is_dev == 'true' }}
          generate_release_notes: true
