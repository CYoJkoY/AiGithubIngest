name: Release Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict Typecheck
        run: pnpm exec tsc --noEmit

      - name: Verify Tag Version matches package.json
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          TAG_VERSION="${RAW_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")

          echo "🔍 开始版本一致性防御复核："
          echo "  - Git Tag:       ${RAW_TAG} (解析版本: ${TAG_VERSION})"
          echo "  - package.json:  ${PKG_VERSION}"
          echo "  - manifest.json: ${MANIFEST_VERSION}"

          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "❌ [Fatal] Git Tag 版本 (${TAG_VERSION}) 与 package.json 版本 (${PKG_VERSION}) 不一致！"
            echo "::error::Tag 版本 (${TAG_VERSION}) 与 package.json (${PKG_VERSION}) 不一致，发布中断！请先更新版本号或纠正 Tag。"
            exit 1
          fi

          if [ "${MANIFEST_VERSION}" != "${PKG_VERSION}" ]; then
            echo "❌ [Fatal] manifest.json 版本 (${MANIFEST_VERSION}) 与 package.json 版本 (${PKG_VERSION}) 不一致！"
            echo "::error::manifest.json 版本 (${MANIFEST_VERSION}) 与 package.json (${PKG_VERSION}) 不一致，发布中断！"
            exit 1
          fi

          echo "✅ 版本复核通过：Tag、package.json 与 manifest.json 版本一致 (${PKG_VERSION})"

      - name: Build production bundle
        run: pnpm run build

      - name: Validate distribution integrity
        run: |
          echo "🔍 正在进行 Manifest V3 产物完整性防御审查..."
          REQUIRED_FILES=(
            "dist/manifest.json"
            "dist/background.js"
            "dist/content.js"
            "dist/popup.html"
            "dist/popup.js"
            "dist/popup.css"
            "dist/toast.css"
          )

          for assetPath in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$assetPath" ]; then
              echo "❌ 关键产物缺失: $assetPath"
              exit 1
            fi
          done
          echo "✅ 产物契约校验通过"

      - name: Package extension archive (ZIP & CRX)
        id: package
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          ARCHIVE_NAME="ai-github-ingest-${TAG_NAME}.zip"
          CRX_NAME="ai-github-ingest-${TAG_NAME}.crx"

          echo "📦 打包 ZIP 产物..."
          cd dist
          zip -r "../${ARCHIVE_NAME}" ./* -x "*.DS_Store*"
          cd ..

          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::error::CRX_PRIVATE_KEY 未配置，无法保证 Extension ID 稳定性，终止打包"
            exit 1
          fi

          echo "🔑 使用 CRX_PRIVATE_KEY 签名打包 CRX3..."
          trap 'rm -f key.pem' EXIT
          echo "$CRX_PRIVATE_KEY" > key.pem
          npx --yes crx3 pack dist -p key.pem -o "${CRX_NAME}"
          rm -f key.pem

          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          sha256sum "${CRX_NAME}" > "${CRX_NAME}.sha256"

          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "checksum_name=${ARCHIVE_NAME}.sha256" >> $GITHUB_OUTPUT
          echo "crx_name=${CRX_NAME}" >> $GITHUB_OUTPUT
          echo "crx_checksum_name=${CRX_NAME}.sha256" >> $GITHUB_OUTPUT
          echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          name: "Release ${{ steps.package.outputs.release_tag }}"
          files: |
            ${{ steps.package.outputs.archive_name }}
            ${{ steps.package.outputs.checksum_name }}
            ${{ steps.package.outputs.crx_name }}
            ${{ steps.package.outputs.crx_checksum_name }}
          draft: false
          prerelease: ${{ contains(steps.package.outputs.release_tag, '-alpha') || contains(steps.package.outputs.release_tag, '-beta') || contains(steps.package.outputs.release_tag, '-rc') }}
          generate_release_notes: true
