name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag to build (for example v0.6.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict Typecheck
        run: pnpm exec tsc --noEmit

      # -----------------------------------------------------------------------
      # 单通道发布：
      #   - Git Tag 只允许 vX.Y.Z
      #   - Tag 必须等于 manifest.version
      #   - package.json.version 必须等于 manifest.version
      #   - manifest.version_name 已停用
      # -----------------------------------------------------------------------
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version || ''")
          MANIFEST_VERSION_NAME=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version_name || ''")
          PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version || ''")

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "🔍 版本契约复核（单通道稳定发布）："
          echo "  - Git Tag:           ${TAG}"
          echo "  - manifest.version:  ${MANIFEST_VERSION}"
          echo "  - package.json:      ${PKG_VERSION}"

          if [[ -n "${MANIFEST_VERSION_NAME}" ]]; then
            echo "::error::已禁用开发版发布模式，manifest.json 不应包含 version_name。"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::无效的稳定版 Release Tag: $TAG （应为 vX.Y.Z）"
            exit 1
          fi

          TAG_VERSION="${TAG#v}"

          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "::error::Tag 版本 ($TAG_VERSION) 必须等于 manifest.version ($MANIFEST_VERSION)"
            exit 1
          fi

          if [[ "$PKG_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "::error::package.json 版本 ($PKG_VERSION) 必须等于 manifest.version ($MANIFEST_VERSION)"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "✅ 版本复核通过：RELEASE_VERSION=${TAG_VERSION}"

      - name: Build production bundle
        run: pnpm run build

      - name: Validate dist manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));

          if (Object.prototype.hasOwnProperty.call(manifest, 'version_name')) {
            throw new Error('dist/manifest.json 不应包含 version_name。');
          }

          if (manifest.version !== process.env.RELEASE_VERSION) {
            throw new Error(
              `dist/manifest.json version (${manifest.version}) 必须等于 RELEASE_VERSION (${process.env.RELEASE_VERSION})`
            );
          }

          console.log(`✅ dist manifest 校验通过：version=${manifest.version}`);
          NODE

      - name: Validate distribution integrity
        run: |
          echo "🔍 正在进行 Manifest V3 产物完整性防御审查..."
          REQUIRED_FILES=(
            "dist/manifest.json"
            "dist/background.js"
            "dist/content.js"
            "dist/popup.html"
            "dist/popup.js"
            "dist/popup.css"
            "dist/toast.css"
          )

          for assetPath in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$assetPath" ]; then
              echo "❌ 关键产物缺失: $assetPath"
              exit 1
            fi
          done

          BUILT_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).version || ''")
          BUILT_VERSION_NAME=$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).version_name || ''")

          if [ -n "$BUILT_VERSION_NAME" ]; then
            echo "❌ 构建产物仍包含 version_name: ${BUILT_VERSION_NAME}"
            exit 1
          fi

          echo "  - 构建产物 version:        ${BUILT_VERSION}"
          echo "  - 构建产物 version_name:   <empty>"
          echo "✅ 产物契约校验通过"

      - name: Package extension archive (ZIP & CRX)
        id: package
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          ARCHIVE_NAME="ai-github-ingest-v${VERSION}.zip"
          CRX_NAME="ai-github-ingest-v${VERSION}.crx"

          echo "📦 打包 ZIP 产物: ${ARCHIVE_NAME}"
          cd dist
          zip -r "../${ARCHIVE_NAME}" ./* -x "*.DS_Store*"
          cd ..
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

          if [ -n "${CRX_PRIVATE_KEY:-}" ]; then
            echo "🔑 使用 CRX_PRIVATE_KEY 签名打包 CRX3..."
            trap 'rm -f key.pem' EXIT
            echo "$CRX_PRIVATE_KEY" > key.pem
            npx --yes crx3 pack dist -p key.pem -o "${CRX_NAME}"
            rm -f key.pem
            sha256sum "${CRX_NAME}" > "${CRX_NAME}.sha256"
          else
            echo "::warning::未检测到 CRX_PRIVATE_KEY Secret，已跳过 CRX 打包，仅发布 ZIP 产物"
          fi

          echo "archive=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "crx=${CRX_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 'Release ${{ steps.version.outputs.tag }}'
          files: |
            ai-github-ingest-v${{ steps.version.outputs.version }}.zip
            ai-github-ingest-v${{ steps.version.outputs.version }}.zip.sha256
            ai-github-ingest-v${{ steps.version.outputs.version }}*.crx
            ai-github-ingest-v${{ steps.version.outputs.version }}*.crx.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
