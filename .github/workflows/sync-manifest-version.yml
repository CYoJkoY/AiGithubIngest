name: Sync Package Version

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-package-version-main
  cancel-in-progress: false

jobs:
  sync-version:
    name: Sync package.json with manifest.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and synchronize version
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');

          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          const stable = String(manifest.version || '').trim();

          if (!/^\d+\.\d+\.\d+$/.test(stable)) {
            throw new Error(`manifest.version 必须符合 X.Y.Z 格式，当前为: ${stable}`);
          }

          if (Object.prototype.hasOwnProperty.call(manifest, 'version_name')) {
            throw new Error('已禁用开发版发布模式，manifest.json 不应包含 version_name。');
          }

          const changed = pkg.version !== stable;

          if (changed) {
            console.log(`🔄 同步 package.json 版本: ${pkg.version} -> ${stable}`);
            pkg.version = stable;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n', 'utf8');
          } else {
            console.log(`✅ package.json 已与 manifest.version 一致: ${stable}`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `new_version=${stable}\n`);
          NODE

      - name: Commit and Push Package Changes
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --staged --quiet; then
            echo "无实际差异，跳过提交"
          else
            git commit -m "chore(release): sync package.json version to ${{ steps.sync.outputs.new_version }}"
            git push origin HEAD:main
          fi
