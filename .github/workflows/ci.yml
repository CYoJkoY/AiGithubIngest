name: CI & Extension Build

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Typecheck & Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict Typecheck
        run: pnpm exec tsc --noEmit

      - name: Validate Manifest Version
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version || ''")
          echo "🔍 检查 manifest.json 版本有效性: ${MANIFEST_VERSION}"
          if [[ ! "${MANIFEST_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::manifest.json 中的版本号 (${MANIFEST_VERSION}) 不符合语义化版本格式 (X.Y.Z)！"
            exit 1
          fi
          echo "✅ manifest.json 版本校验通过: ${MANIFEST_VERSION}"

      - name: Build Extension Artifacts
        run: pnpm run build

      - name: Verify Clean Worktree After Build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建触发了非预期的工作区变更（例如本地隐式补正版本），请在提交前保持工作区干净："
            git status --porcelain
            exit 1
          fi

      - name: Archive Extension Zip
        run: |
          cd dist
          zip -r ../ai-github-ingest-extension.zip ./*
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-github-ingest-extension
          path: ai-github-ingest-extension.zip
          retention-days: 14
