name: CI & Extension Build

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Typecheck & Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict Typecheck
        run: pnpm exec tsc --noEmit

      - name: Validate manifest version and version_name
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');

          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          const stable = String(manifest.version || '').trim();
          const name = String(manifest.version_name || '').trim();

          if (!/^\d+\.\d+\.\d+$/.test(stable)) {
            throw new Error(`manifest.version 必须符合 X.Y.Z 格式，当前为: ${stable}`);
          }

          if (name) {
            if (!/^\d+\.\d+\.\d+\.dev\d+$/.test(name)) {
              throw new Error(`manifest.version_name 必须符合 X.Y.Z.devN 格式，当前为: ${name}`);
            }
            if (!name.startsWith(`${stable}.dev`)) {
              throw new Error(
                `manifest.version_name (${name}) 必须以 manifest.version (${stable}) 作为前缀`
              );
            }
          }

          if (pkg.version !== stable) {
            throw new Error(
              `package.json version (${pkg.version}) 必须等于 manifest.version (${stable})`
            );
          }

          console.log(
            `√ 版本校验通过: version=${stable}` +
              (name ? `, version_name=${name}` : '')
          );
          NODE

      - name: Build Extension Artifacts
        run: pnpm run build

      - name: Verify Clean Worktree After Build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建触发了非预期的工作区变更（例如本地隐式补正版本），请在提交前保持工作区干净："
            git status --porcelain
            exit 1
          fi

      - name: Archive Extension Zip
        run: |
          cd dist
          zip -r ../ai-github-ingest-extension.zip ./*
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-github-ingest-extension
          path: ai-github-ingest-extension.zip
          retention-days: 14
