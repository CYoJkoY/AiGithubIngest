<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="support-cta-title">
  <title id="support-cta-title">Support AzSkills — reusable engineering and design contracts</title>

  <!-- Canvas: warm paper surface with a soft keyline so the CTA stays legible on both GitHub light and dark backgrounds -->
  <rect x="0" y="0" width="640" height="200" rx="20" fill="#F7F4ED"/>
  <rect x="0.5" y="0.5" width="639" height="199" rx="19.5" fill="none" stroke="#E2DED4" stroke-width="1"/>

  <!-- Modular skill blocks: a 3×3 lattice drawn in AzSkills' sage palette.
       The repeated unit is the project-native motif — a bounded, composable contract. -->
  <g transform="translate(38, 44)">
    <rect x="0"  y="0"  width="32" height="32" rx="8" fill="#8A9E8B"/>
    <rect x="40" y="0"  width="32" height="32" rx="8" fill="#B8C7B9"/>
    <rect x="80" y="0"  width="32" height="32" rx="8" fill="#6B7F6D"/>

    <rect x="0"  y="40" width="32" height="32" rx="8" fill="#B8C7B9"/>
    <rect x="40" y="40" width="32" height="32" rx="8" fill="#6B7F6D"/>
    <rect x="80" y="40" width="32" height="32" rx="8" fill="#8A9E8B"/>

    <rect x="0"  y="80" width="32" height="32" rx="8" fill="#6B7F6D"/>
    <rect x="40" y="80" width="32" height="32" rx="8" fill="#8A9E8B"/>
    <rect x="80" y="80" width="32" height="32" rx="8" fill="#B8C7B9"/>
  </g>

  <!-- Heading -->
  <text x="182" y="74"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="24"
        font-weight="700"
        letter-spacing="-0.02em"
        fill="#2C3A2E">Support AzSkills</text>

  <!-- Support line -->
  <text x="182" y="102"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="14"
        fill="#5A6B5C">Reusable skills for engineering and design.</text>

  <!-- Canonical destination, rendered as searchable text so it remains readable even if images are blocked -->
  <text x="182" y="150"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="15"
        fill="#6B7F6D">cyojkoy.github.io/Payment/</text>

  <!-- Directional cue: keeps the CTA's action legible without relying on color alone -->
  <g transform="translate(566, 88)"
     fill="none"
     stroke="#8A9E8B"
     stroke-width="2.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M 0 20 L 32 20"/>
    <path d="M 22 10 L 32 20 L 22 30"/>
  </g>
</svg>
