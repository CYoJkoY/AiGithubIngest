<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 280" width="100%" role="img" aria-labelledby="supTitle supDesc">
  <title id="supTitle">Support AiGithubIngest development</title>
  <desc id="supDesc">Sponsorship call-to-action for AiGithubIngest — local, zero-proxy GitHub ingestion for AI conversations.</desc>

  <defs>
    <style>
      .bg       { fill: #0f172a; }
      .frame    { fill: none; stroke: #334155; stroke-width: 2; }
      .card     { fill: #1e293b; stroke: #334155; stroke-width: 2; }
      .accent   { fill: #38bdf8; }
      .accent-s { stroke: #38bdf8; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .accent-m { stroke: #38bdf8; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .eyebrow  { font: 600 20px "SF Mono", Consolas, "Liberation Mono", monospace; fill: #38bdf8; letter-spacing: 0.22em; }
      .head     { font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #f8fafc; letter-spacing: -0.01em; }
      .sub      { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94a3b8; }
      .cta      { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #38bdf8; letter-spacing: 0.02em; }
    </style>
  </defs>

  <rect class="bg" width="1240" height="280" rx="20"/>
  <rect class="frame" x="1" y="1" width="1238" height="278" rx="19"/>

  <!-- Project-derived mark: code file with outbound arrow -->
  <g transform="translate(48 60)">
    <rect class="card" x="0" y="0" width="160" height="160" rx="14"/>
    <circle class="accent" cx="140" cy="20" r="5"/>
    <line class="accent-s" x1="28" y1="52" x2="112" y2="52"/>
    <line class="accent-m" x1="28" y1="80" x2="132" y2="80" opacity="0.7"/>
    <line class="accent-m" x1="28" y1="108" x2="96" y2="108" opacity="0.5"/>
    <path class="accent-s" d="M 60 132 L 100 132 M 88 120 L 100 132 L 88 144"/>
  </g>

  <!-- Eyebrow / Head / Sub -->
  <text x="248" y="94"  class="eyebrow">SUPPORT THE PROJECT</text>
  <text x="248" y="146" class="head">Support AiGithubIngest</text>
  <text x="248" y="188" class="sub">Local, zero-proxy GitHub ingestion for AI conversations.</text>

  <!-- Right-side CTA label -->
  <text x="1192" y="146" text-anchor="end" class="cta">Sponsor →</text>
</svg>
